<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#030305" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wallee" />
  <title>Wallee</title>
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./Assets/icon-192.svg" />
  <link rel="icon" href="./Assets/icon-192.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">
    <section id="homeView" class="view view-active">
      <div class="home-ambient"></div>

      <div class="home-center">
        <div class="brain-stage">
          <button id="homeBrain" class="brain brain-home" type="button" aria-label="Create new item">
            <span class="brain-aura"></span>
            <span class="brain-object">
              <svg class="brain-svg" viewBox="0 0 280 270" aria-hidden="true">
                <defs>
                  <radialGradient id="brainFill" cx="44%" cy="34%" r="75%">
                    <stop offset="0%" stop-color="#edf3ff" stop-opacity=".94"/>
                    <stop offset="19%" stop-color="#9ebdff" stop-opacity=".58"/>
                    <stop offset="53%" stop-color="#676b94" stop-opacity=".40"/>
                    <stop offset="100%" stop-color="#12131d" stop-opacity=".93"/>
                  </radialGradient>
                  <linearGradient id="brainStroke" x1="0" x2="1">
                    <stop offset="0%" stop-color="#79a8ff"/>
                    <stop offset="48%" stop-color="#d6dcff"/>
                    <stop offset="100%" stop-color="#b072ff"/>
                  </linearGradient>
                  <filter id="innerGlow">
                    <feGaussianBlur stdDeviation="6" result="blur"/>
                    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                  </filter>
                </defs>
                <path class="brain-shell" d="M140 35 C118 17 86 25 76 49 C48 42 28 64 31 92 C9 107 12 143 34 157 C23 188 43 217 75 216 C84 243 117 248 139 229 C161 248 196 242 204 215 C236 216 257 186 245 156 C269 140 270 105 248 91 C252 64 232 43 204 49 C193 24 161 17 140 35 Z"/>
                <path class="brain-divider" d="M140 39 C129 65 145 83 137 105 C129 126 148 143 139 167 C132 188 143 205 139 228"/>
                <path class="brain-groove" d="M74 61 C91 64 97 79 89 93 C80 108 91 122 109 118"/>
                <path class="brain-groove" d="M49 103 C69 94 87 105 83 123 C80 141 96 153 115 146"/>
                <path class="brain-groove" d="M48 161 C67 150 85 161 82 181 C79 198 94 207 112 201"/>
                <path class="brain-groove" d="M104 48 C116 59 117 74 108 86 C101 97 106 108 119 112"/>
                <path class="brain-groove" d="M205 61 C188 64 182 79 190 93 C199 108 188 122 170 118"/>
                <path class="brain-groove" d="M231 103 C211 94 193 105 197 123 C200 141 184 153 165 146"/>
                <path class="brain-groove" d="M231 161 C212 150 194 161 197 181 C200 198 185 207 167 201"/>
                <path class="brain-groove" d="M176 48 C164 59 163 74 172 86 C179 97 174 108 161 112"/>
              </svg>
            </span>
          </button>
          <span id="brainLapCount" class="brain-laps">0</span>
        </div>

        <div id="capturePanel" class="capture-panel" aria-hidden="true">
          <div id="captureCategoryStep" class="capture-step capture-step-active">
            <p class="capture-eyebrow">NEW</p>
            <div class="capture-categories">
              <button type="button" class="capture-category do" data-capture-category="do">DO</button>
              <button type="button" class="capture-category think" data-capture-category="think">THINK</button>
              <button type="button" class="capture-category private" data-capture-category="private">PRIVATE</button>
            </div>
            <button id="cancelCaptureButton" class="ghost-action" type="button">Cancel</button>
          </div>

          <form id="captureForm" class="capture-step">
            <div class="capture-form-head">
              <span id="captureTypeBadge" class="type-badge">DO</span>
              <button id="changeCaptureCategory" class="tiny-action" type="button">Change</button>
            </div>
            <textarea id="captureText" class="capture-textarea" rows="7" placeholder="First line becomes the title…" required></textarea>

            <div class="capture-tools">
              <div class="capture-tool">
                <span class="tool-label">Attachments</span>
                <div id="captureMediaGrid" class="capture-media-grid"></div>
                <label class="add-attachment">
                  <input id="captureMediaInput" type="file" accept="image/*" multiple hidden />
                  <span>＋ Add image</span><small>0–3</small>
                </label>
              </div>
              <div class="capture-tool">
                <span class="tool-label">Priority</span>
                <div class="priority-control">
                  <button type="button" data-priority="low">LOW</button>
                  <button type="button" data-priority="high">HIGH</button>
                </div>
              </div>
            </div>

            <div class="capture-form-actions">
              <button id="cancelCaptureForm" class="secondary-action" type="button">Cancel</button>
              <button class="primary-action" type="submit">Save to brain</button>
            </div>
          </form>
        </div>
      </div>

      <nav class="home-categories" aria-label="Wallee lists">
        <button class="home-category do" data-open-category="do"><span>DO</span><strong id="homeDoCount">0</strong></button>
        <button class="home-category think" data-open-category="think"><span>THINK</span><strong id="homeThinkCount">0</strong></button>
        <button class="home-category private" data-open-category="private"><span>PRIVATE</span><strong id="homePrivateCount">0</strong></button>
      </nav>
    </section>

    <section id="listView" class="view">
      <div id="listGlow" class="list-glow"></div>
      <header class="list-header">
        <button id="listHomeButton" class="wallee-wordmark" type="button">WALLEE</button>
        <button id="brainPageButton" class="mini-brain-button" type="button" aria-label="Open brain space">
          <svg viewBox="0 0 64 60" aria-hidden="true">
            <path d="M32 8 C25 2 17 5 15 12 C7 11 4 18 6 24 C0 28 2 38 8 40 C6 49 14 55 22 52 C25 59 31 58 32 54 C35 59 41 59 44 52 C53 55 60 48 57 40 C64 36 64 28 58 24 C60 17 54 11 47 12 C45 5 38 2 32 8 Z"/>
          </svg>
        </button>
      </header>

      <div class="list-controls">
        <div class="category-switch" role="tablist">
          <button class="category-tab" data-list-category="do">DO <span id="listDoCount">0</span></button>
          <button class="category-tab" data-list-category="think">THINK <span id="listThinkCount">0</span></button>
          <button class="category-tab" data-list-category="private">PRIVATE <span id="listPrivateCount">0</span></button>
        </div>

        <div class="list-subcontrols">
          <div class="status-switch">
            <button class="status-tab status-tab-active" data-list-status="open">OPEN</button>
            <button class="status-tab" data-list-status="closed">CLOSED</button>
          </div>
          <button id="sortButton" class="sort-button" type="button"><span>↕</span><span id="sortLabel">Manual</span></button>
        </div>
      </div>

      <div id="itemsGrid" class="items-grid scroll-zone"></div>
    </section>

    <section id="detailView" class="view">
      <div class="detail-shell">
        <div id="detailScroll" class="detail-scroll scroll-zone">
          <header class="detail-heading">
            <span id="detailTypeBadge" class="type-badge">DO</span>
            <span id="detailPriority" class="priority-meta hidden"></span>
          </header>

          <div id="detailMedia" class="detail-media hidden"></div>

          <article class="detail-copy glass-panel">
            <h1 id="detailTitle"></h1>
            <div id="detailText" class="detail-text"></div>
            <button id="editTextInlineButton" class="inline-link" type="button">Edit text</button>
          </article>

          <section class="comments-panel glass-panel">
            <div class="comments-heading"><span>Comments</span><span id="commentCount">0</span></div>
            <div id="commentList" class="comment-list"></div>
            <label class="comment-composer">
              <input id="commentInput" type="text" placeholder="Add a comment…" autocomplete="off" />
              <button id="addCommentButton" type="button">↗</button>
            </label>
          </section>
        </div>

        <footer class="detail-actions">
          <button id="detailBackButton" class="detail-action secondary-action" type="button">← Back</button>
          <button id="detailEditButton" class="detail-action secondary-action" type="button">Edit</button>
          <button id="detailCloseButton" class="detail-action close-action" type="button">Close</button>
        </footer>
      </div>
    </section>

    <section id="brainView" class="view brain-space-view">
      <button id="closeBrainPage" class="brain-space-close" type="button" aria-label="Back to list">×</button>
      <div class="brain-space-center">
        <div class="brain brain-space-brain">
          <span class="brain-aura"></span>
          <span class="brain-object">
            <svg class="brain-svg" viewBox="0 0 280 270" aria-hidden="true">
              <path class="brain-shell" d="M140 35 C118 17 86 25 76 49 C48 42 28 64 31 92 C9 107 12 143 34 157 C23 188 43 217 75 216 C84 243 117 248 139 229 C161 248 196 242 204 215 C236 216 257 186 245 156 C269 140 270 105 248 91 C252 64 232 43 204 49 C193 24 161 17 140 35 Z"/>
              <path class="brain-divider" d="M140 39 C129 65 145 83 137 105 C129 126 148 143 139 167 C132 188 143 205 139 228"/>
              <path class="brain-groove" d="M74 61 C91 64 97 79 89 93 C80 108 91 122 109 118"/>
              <path class="brain-groove" d="M49 103 C69 94 87 105 83 123 C80 141 96 153 115 146"/>
              <path class="brain-groove" d="M48 161 C67 150 85 161 82 181 C79 198 94 207 112 201"/>
              <path class="brain-groove" d="M205 61 C188 64 182 79 190 93 C199 108 188 122 170 118"/>
              <path class="brain-groove" d="M231 103 C211 94 193 105 197 123 C200 141 184 153 165 146"/>
              <path class="brain-groove" d="M231 161 C212 150 194 161 197 181 C200 198 185 207 167 201"/>
            </svg>
          </span>
        </div>
      </div>
    </section>

    <div id="sheetBackdrop" class="sheet-backdrop hidden"></div>

    <section id="editSheet" class="bottom-sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header">
        <button id="cancelEditButton" class="tiny-action" type="button">Cancel</button>
        <strong>Edit</strong>
        <button id="saveEditButton" class="tiny-action" type="button">Save</button>
      </div>
      <textarea id="editText" class="sheet-textarea" rows="8"></textarea>
      <div class="edit-sheet-row">
        <span>Priority</span>
        <div class="priority-control">
          <button type="button" data-edit-priority="low">LOW</button>
          <button type="button" data-edit-priority="high">HIGH</button>
        </div>
      </div>
      <div class="edit-sheet-row edit-media-row">
        <span>Attachments</span>
        <div id="editMediaGrid" class="capture-media-grid"></div>
        <label class="add-attachment">
          <input id="editMediaInput" type="file" accept="image/*" multiple hidden />
          <span>＋ Add image</span><small>Max 3</small>
        </label>
      </div>
      <button id="deleteItemButton" class="danger-action" type="button">Delete item</button>
    </section>

    <section id="sortSheet" class="bottom-sheet sort-sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <strong class="sort-sheet-title">Sort</strong>
      <button data-sort="manual">Manual</button>
      <button data-sort="priority">Priority</button>
      <button data-sort="newest">Newest</button>
      <button data-sort="oldest">Oldest</button>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
