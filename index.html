<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#030406" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wallee" />
  <title>Wallee</title>

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./Assets/icon-192.svg" />
  <link rel="icon" href="./Assets/icon-192.svg" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main id="app" class="app-shell" aria-live="polite">

    <section id="homeView" class="view view-active">
      <div class="home-background">
        <span class="home-light home-light-a"></span>
        <span class="home-light home-light-b"></span>
      </div>

      <div class="home-main">
        <button id="homeCubeButton" class="cube-hero-button" type="button" aria-label="Create new item">
          <span class="cube-floor-glow"></span>
          <span class="cube-canvas-wrap">
            <canvas id="homeCubeCanvas" class="cube-canvas"></canvas>
          </span>
        </button>
      </div>

      <nav class="home-category-dock" aria-label="Lists">
        <button class="category-launch content" data-open-category="content" type="button" aria-label="Content">
          <span class="category-icon instagram-icon" aria-hidden="true"><span class="instagram-camera"></span></span>
          <span id="homeContentCount" class="notification-badge hidden">0</span>
        </button>

        <button class="category-launch do" data-open-category="do" type="button" aria-label="Do">
          <span class="category-icon line-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M39 10l15 15-8 8-4-4-19 19-7 2 2-7 19-19-5-5z"/><path d="M11 13l10 10"/></svg>
          </span>
          <span id="homeDoCount" class="notification-badge hidden">0</span>
        </button>

        <button class="category-launch think" data-open-category="think" type="button" aria-label="Think">
          <span class="category-icon line-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <path d="M31 11c-7-7-18-1-16 8-9 1-11 13-3 18-6 8 2 18 11 15 3 7 13 7 17 1 6 6 16 3 17-5 8-3 9-15 2-19 4-10-8-17-16-12-2-8-12-11-18-6z"/>
              <path d="M31 14v36M18 24c8-2 12 3 12 9M18 40c7 3 10 0 13-5M46 23c-7 0-10 4-10 9M47 41c-8 2-10-2-11-7"/>
            </svg>
          </span>
          <span id="homeThinkCount" class="notification-badge hidden">0</span>
        </button>

        <button class="category-launch private" data-open-category="private" type="button" aria-label="Private">
          <span class="category-icon line-icon" aria-hidden="true">
            <svg viewBox="0 0 64 64"><path d="M32 53S10 40 10 23c0-8 10-13 17-7l5 5 5-5c7-6 17-1 17 7 0 17-22 30-22 30z"/></svg>
          </span>
          <span id="homePrivateCount" class="notification-badge hidden">0</span>
        </button>
      </nav>
    </section>

    <section id="listView" class="view">
      <div id="listAmbient" class="list-ambient category-content">
        <span class="ambient-shape ambient-one"></span>
        <span class="ambient-shape ambient-two"></span>
        <span class="ambient-line"></span>
      </div>

      <header class="list-header">
        <div class="list-identity">
          <span id="listIdentityIcon" class="list-identity-icon"></span>
          <div class="list-identity-copy">
            <strong id="listIdentityCount">0</strong>
            <small>open</small>
          </div>
        </div>

        <button id="futureSpaceButton" class="future-space-button" type="button" aria-label="Open cube space">
          <svg viewBox="0 0 64 64" aria-hidden="true"><path d="M32 8l20 11v25L32 56 12 44V19z"/><path d="M12 19l20 12 20-12M32 31v25"/></svg>
        </button>
      </header>

      <div class="list-top-controls">
        <div class="category-strip" role="tablist" aria-label="Categories">
          <button data-list-category="content" type="button" aria-label="Content"><span class="mini-instagram"></span></button>
          <button data-list-category="do" type="button" aria-label="Do"><svg viewBox="0 0 64 64"><path d="M39 10l15 15-8 8-4-4-19 19-7 2 2-7 19-19-5-5z"/></svg></button>
          <button data-list-category="think" type="button" aria-label="Think"><svg viewBox="0 0 64 64"><path d="M31 11c-7-7-18-1-16 8-9 1-11 13-3 18-6 8 2 18 11 15 3 7 13 7 17 1 6 6 16 3 17-5 8-3 9-15 2-19 4-10-8-17-16-12-2-8-12-11-18-6z"/></svg></button>
          <button data-list-category="private" type="button" aria-label="Private"><svg viewBox="0 0 64 64"><path d="M32 53S10 40 10 23c0-8 10-13 17-7l5 5 5-5c7-6 17-1 17 7 0 17-22 30-22 30z"/></svg></button>
        </div>

        <div class="status-switch">
          <button class="status-tab status-tab-active" data-list-status="open" type="button">OPEN</button>
          <button class="status-tab" data-list-status="closed" type="button">CLOSED</button>
        </div>
      </div>

      <div id="itemsGrid" class="items-grid scroll-zone"></div>

      <nav class="list-bottom-dock" aria-label="List actions">
        <button id="listHomeButton" class="dock-action" type="button" aria-label="Home"><svg viewBox="0 0 64 64"><path d="M12 31L32 14l20 17v21H38V39H26v13H12z"/></svg></button>
        <button id="listAddButton" class="dock-add" type="button" aria-label="Add new item"><span></span><span></span></button>
        <button id="sortButton" class="dock-action" type="button" aria-label="Sort"><svg viewBox="0 0 64 64"><path d="M13 18h38M20 32h31M29 46h22"/><circle cx="22" cy="18" r="4"/><circle cx="43" cy="32" r="4"/><circle cx="36" cy="46" r="4"/></svg></button>
      </nav>
    </section>

    <section id="detailView" class="view">
      <div class="detail-shell">
        <div id="detailScroll" class="detail-scroll scroll-zone">
          <header class="detail-heading">
            <span id="detailTypeBadge" class="type-badge">CONTENT</span>
            <span id="detailPriority" class="priority-meta hidden"></span>
          </header>

          <div id="detailMedia" class="detail-media hidden"></div>

          <article class="detail-copy glass-panel">
            <h1 id="detailTitle"></h1>
            <div id="detailText" class="detail-text"></div>
            <button id="editTextInlineButton" class="inline-link" type="button">Edit text</button>
          </article>

          <section class="comments-panel glass-panel">
            <div class="comments-heading"><span>Comments</span><span id="commentCount">0</span></div>
            <div id="commentList" class="comment-list"></div>
            <label class="comment-composer"><input id="commentInput" type="text" placeholder="Add a comment…" autocomplete="off" /><button id="addCommentButton" type="button">↗</button></label>
          </section>
        </div>

        <footer class="detail-actions">
          <button id="detailBackButton" class="detail-action secondary-action" type="button">← Back</button>
          <button id="detailEditButton" class="detail-action secondary-action" type="button">Edit</button>
          <button id="detailCloseButton" class="detail-action close-action" type="button">Close</button>
        </footer>
      </div>
    </section>

    <section id="futureView" class="view future-view">
      <button id="closeFutureButton" class="future-close" type="button" aria-label="Back">×</button>
      <div class="future-cube-stage"><canvas id="futureCubeCanvas" class="cube-canvas future-cube"></canvas></div>
    </section>

    <div id="captureBackdrop" class="modal-backdrop hidden"></div>
    <section id="captureOverlay" class="capture-overlay hidden" role="dialog" aria-modal="true">
      <div id="captureCategoryStep" class="capture-step capture-step-active">
        <p class="capture-eyebrow">NEW</p>
        <div class="capture-category-grid">
          <button type="button" class="capture-category-button content" data-capture-category="content"><span class="category-icon instagram-icon"><span class="instagram-camera"></span></span></button>
          <button type="button" class="capture-category-button do" data-capture-category="do"><span class="category-icon line-icon"><svg viewBox="0 0 64 64"><path d="M39 10l15 15-8 8-4-4-19 19-7 2 2-7 19-19-5-5z"/></svg></span></button>
          <button type="button" class="capture-category-button think" data-capture-category="think"><span class="category-icon line-icon"><svg viewBox="0 0 64 64"><path d="M31 11c-7-7-18-1-16 8-9 1-11 13-3 18-6 8 2 18 11 15 3 7 13 7 17 1 6 6 16 3 17-5 8-3 9-15 2-19 4-10-8-17-16-12-2-8-12-11-18-6z"/></svg></span></button>
          <button type="button" class="capture-category-button private" data-capture-category="private"><span class="category-icon line-icon"><svg viewBox="0 0 64 64"><path d="M32 53S10 40 10 23c0-8 10-13 17-7l5 5 5-5c7-6 17-1 17 7 0 17-22 30-22 30z"/></svg></span></button>
        </div>
        <button id="cancelCaptureButton" class="ghost-action" type="button">Cancel</button>
      </div>

      <form id="captureForm" class="capture-step">
        <div class="capture-form-head"><span id="captureTypeBadge" class="type-badge">CONTENT</span><button id="changeCaptureCategory" class="tiny-action" type="button">Change</button></div>
        <textarea id="captureText" class="capture-textarea" rows="7" placeholder="First line becomes the title…" required></textarea>

        <div class="capture-tools">
          <div class="capture-tool">
            <span class="tool-label">Attachments</span>
            <div id="captureMediaGrid" class="capture-media-grid"></div>
            <label class="add-attachment"><input id="captureMediaInput" type="file" accept="image/*" multiple hidden /><span>＋ Add image</span><small>0–3</small></label>
          </div>

          <div class="capture-tool">
            <span class="tool-label">Priority</span>
            <div class="priority-control"><button type="button" data-priority="low">LOW</button><button type="button" data-priority="high">HIGH</button></div>
          </div>
        </div>

        <div class="capture-form-actions"><button id="cancelCaptureForm" class="secondary-action" type="button">Cancel</button><button class="primary-action" type="submit">Save</button></div>
      </form>
    </section>

    <div id="sheetBackdrop" class="modal-backdrop hidden"></div>

    <section id="editSheet" class="bottom-sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-header"><button id="cancelEditButton" class="tiny-action" type="button">Cancel</button><strong>Edit</strong><button id="saveEditButton" class="tiny-action" type="button">Save</button></div>
      <textarea id="editText" class="sheet-textarea" rows="8"></textarea>
      <div class="edit-sheet-row"><span>Priority</span><div class="priority-control"><button type="button" data-edit-priority="low">LOW</button><button type="button" data-edit-priority="high">HIGH</button></div></div>
      <div class="edit-sheet-row"><span>Attachments</span><div id="editMediaGrid" class="capture-media-grid"></div><label class="add-attachment"><input id="editMediaInput" type="file" accept="image/*" multiple hidden /><span>＋ Add image</span><small>Max 3</small></label></div>
      <button id="deleteItemButton" class="danger-action" type="button">Delete item</button>
    </section>

    <section id="sortSheet" class="bottom-sheet sort-sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <strong class="sort-sheet-title">Sort</strong>
      <button data-sort="manual" type="button">Manual <span>↕</span></button>
      <button data-sort="priority" type="button">Priority <span>☆</span></button>
      <button data-sort="newest" type="button">Newest <span>◷</span></button>
      <button data-sort="oldest" type="button">Oldest <span>◴</span></button>
    </section>

    <div id="toast" class="toast hidden"></div>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
